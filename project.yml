name: ThanhDatDeveloper

options:
  bundleIdPrefix: com.thanhdat
  deploymentTarget:
    iOS: "16.0"

targets:
  ThanhDatDeveloper:
    type: application
    platform: iOS
    sources:
      - path: ContentView.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thanhdat.developer
        PRODUCT_NAME: ThanhDatDeveloper
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_CFBundleDisplayName: "Thanh Dat"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
