name: Build Unsigned IPA

‘on’:
workflow_dispatch:
push:
branches:
- main
- master

jobs:
build:
runs-on: macos-latest

steps:
  - name: Checkout source
    uses: actions/checkout@v4
  - name: Install XcodeGen
    run: brew install xcodegen
  - name: Generate Xcode project
    run: xcodegen generate
  - name: Build app
    run: |
      set -o pipefail
      xcodebuild \
        -project ThanhDatDeveloper.xcodeproj \
        -scheme ThanhDatDeveloper \
        -configuration Release \
        -sdk iphoneos \
        -destination 'generic/platform=iOS' \
        -derivedDataPath build \
        TARGETED_DEVICE_FAMILY=1 \
        CODE_SIGNING_ALLOWED=NO \
        CODE_SIGNING_REQUIRED=NO \
        build
  - name: Package IPA
    run: |
      mkdir -p Payload
      cp -R build/Build/Products/Release-iphoneos/ThanhDatDeveloper.app Payload/
      /usr/bin/zip -r ThanhDatDeveloper-unsigned.ipa Payload
  - name: Upload IPA
    uses: actions/upload-artifact@v4
    with:
      name: ThanhDatDeveloper-iPhone-unsigned-IPA
      path: ThanhDatDeveloper-unsigned.ipa
